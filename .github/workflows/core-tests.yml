name: Core tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Check frontend JavaScript syntax
        run: node --check web/workflow_director_lab.js

      - name: Test frontend lab behavior
        run: node --test tests/lab_ui.test.cjs

      - name: Run backend-agnostic core tests
        run: python -m unittest discover -s tests -v
